<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Study Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-top">
          <h1 class="logo">Study Planner</h1>
          <nav>
            <ul>
              <li><a href="dashboard.html">Dashboard</a></li>
              <li class="active"><a href="task.html">Task</a></li>
              <li><a href="calendar.html">Calendar</a></li>
            </ul>
          </nav>
        </div>
        <div class="logout-btn">
          <a href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> 
            Log out
          </a>
        </div>
      </aside>

      <main class="content">
        <section id="taskPage" class="page">
          
          <div class="card task-form">
            <h2>Masukkan Tugas</h2>
            <div class="form-grid">
              
              <div class="form-column">
                <select id="taskSubject">
                  <option value="">Pilih Mata Kuliah</option>
                  <option value="Algoritma dan Pemrograman">Algoritma dan Pemrograman</option>
                  <option value="Kalkulus 2">Kalkulus 2</option>
                  <option value="Bahasa Inggris">Bahasa Inggris</option>
                </select>

                <select id="taskType">
                  <option value="">Pilih Jenis Tugas</option>
                  <option value="Tugas Mandiri">Tugas Mandiri</option>
                  <option value="Project">Project</option>
                  <option value="Makalah">Makalah</option>
                </select>

                <input type="text" id="taskLink" placeholder="Tautan">
                <input type="date" id="taskDeadline">
              </div>

              <div class="form-column">
                <textarea id="taskDesc" placeholder="Keterangan"></textarea>
                
                <div class="subtask-input-group">
                  <input type="text" id="subTaskInput" placeholder="+ Tambah sub tugas">
                  <button type="button" class="add-sub-btn" onclick="addSubTaskToList()">+</button>
                </div>
                <ul id="temporarySubTaskList"></ul>
              </div>

            </div>
            <div class="form-actions">
              <button class="add-btn" onclick="addTask()">Tambah</button>
            </div>
          </div>

          <div class="card task-list-card">
            <h2>List-list tugas</h2>
            <div class="task-list-wrapper">
               </div>
          </div>

        </section> 
      </main>
    </div>
</body>
</html>
