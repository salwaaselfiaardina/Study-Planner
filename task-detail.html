<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Tugas - Study Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-top">
          <h1 class="logo">Study Planner</h1>
          <nav>
            <ul>
              <li><a href="dashboard.html">Dashboard</a></li>

        </div>
        <div class="logout-btn">

            <div class="detail-container">

                      <p>🔗 Tautan</p>
                      <p>📋 Keterangan</p>
                    </div>
                  </div>
                  <div class="detail-meta-group">
                    <span>📅 26-05-2026</span>
                    <span>⏰ 16.00 WIB</span>
                    <button class="delete-btn">Hapus</button>
                  </div>
                </div>
              </div>

              <div class="detail-box">
                <div class="detail-header-row">
                  <div class="detail-title-group">
                    <input type="checkbox">
                    <div class="title-with-icon">
                      <h4>📄 Algoritma dan Pemrograman</h4>
                      <p>📝 Project</p>
                      <p>🔗 Tautan</p>
                      <p>📋 Keterangan</p>
                      
                      <div class="sub-task-group">
                        <label><input type="checkbox"> Sub tugas</label>
                        <label><input type="checkbox"> Sub tugas</label>
                      </div>
                    </div>
                  </div>
                  <div class="detail-meta-group">
                    <div class="mini-progress-inline">
                      <div class="mini-progress-bar"><div class="mini-progress-fill" style="width: 75%;"></div></div>
                      <span>75%</span>
                    </div>
                    <span>📅 29-05-2026</span>
                    <span>⏰ 23.00 WIB</span>
                    <button class="delete-btn">Hapus</button>
                  </div>
                </div>
                <div class="sub-task-dates">
                  <span>📅 15-05-2026</span>
                  <span>📅 22-05-2026</span>
                </div>
              </div>

            </div>
          </div>
        </section>
      </main>
    </div>
</body>
</html>
